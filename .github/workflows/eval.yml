name: Evaluation Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: Repo Integrity (Portable)
    runs-on: ubuntu-latest
    # No pip install — stdlib only. Tests repo structure and file validity.

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate eval suite JSON
        # Validates the suite actually consumed by eval_runner.py and
        # enforces presence of killer queries protecting the gate.
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          path = Path("tests/eval_queries.json")
          assert path.exists(), f"{path} not found"

          with path.open(encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data, list), f"{path} must be a JSON array"
          assert data, f"{path} is empty"

          missing_query = [i for i, q in enumerate(data) if not (q.get("query") or q.get("question"))]
          assert not missing_query, f"Queries without a 'query'/'question' field at indices: {missing_query}"

          killers = [q for q in data if q.get("killer") is True]
          assert killers, (
              f"{path} must define at least one killer query; "
              "removing them silently weakens the canonical gate."
          )

          print(f"{path} OK — {len(data)} queries ({len(killers)} killer)")
          PY

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile eval_runner.py       && echo 'eval_runner.py OK'
          python -m py_compile app/config.py        && echo 'app/config.py OK'
          python -m py_compile app/pipeline.py     && echo 'app/pipeline.py OK'
          python -m py_compile generation/llm.py    && echo 'generation/llm.py OK'
          python -m py_compile evaluation/eval_main.py && echo 'evaluation/eval_main.py OK'

  eval:
    name: RAG Evaluation (Dev Mode - 95% Gate)
    runs-on: ubuntu-latest
    # Hard ceiling: prevents runaway CI from Ollama hangs / infinite retries.
    timeout-minutes: 25
    env:
      # 60s covers embed batches of 32 chunks on CPU runners (~2x margin
      # over observed 20-35s typical). Chat calls bounded independently
      # by --query-timeout=45 in eval_runner. See eval_strict.yml.
      TIMEOUT: "60"
      MAX_RETRIES: "1"
      CHAT_MODEL: qwen3:8b
      EMBED_MODEL: nomic-embed-text

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Ollama service
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "--- Ollama log ---"; cat /tmp/ollama.log || true' ERR

          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              break
            fi
            echo "Waiting for Ollama... ($i)"
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            echo "Ollama failed to start"
            cat /tmp/ollama.log || true
            exit 1
          fi

          ollama pull qwen3:8b
          ollama pull nomic-embed-text

      - name: Build FAISS indexes
        timeout-minutes: 8
        run: python scripts/build_indexes.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run evaluation (dev mode)
        # Parallel execution + per-query timeout + fast mode.
        # See eval_runner.py for flag semantics.
        timeout-minutes: 12
        run: |
          python eval_runner.py \
            --mode dev \
            --workers 4 \
            --query-timeout 45 \
            --fast \
            --report reports/ci_eval.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: reports/ci_eval.json
          retention-days: 30

      - name: Upload Ollama log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ollama-log-${{ github.run_id }}
          path: /tmp/ollama.log
          retention-days: 7
          if-no-files-found: ignore
