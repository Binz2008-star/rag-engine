name: Evaluation Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: Repo Integrity (Portable)
    runs-on: ubuntu-latest
    # No pip install — stdlib only. Tests repo structure and file validity.

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate eval suite JSON
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/adversarial_eval_queries.json', encoding='utf-8'))
          assert isinstance(data, dict) and 'queries' in data, 'adversarial_eval_queries.json is malformed'
          assert len(data['queries']) > 0, 'adversarial_eval_queries.json is empty'
          print(f'adversarial_eval_queries.json OK — {len(data[\"queries\"])} tests')
          "

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile eval_runner.py       && echo 'eval_runner.py OK'
          python -m py_compile app/config.py        && echo 'app/config.py OK'
          python -m py_compile app/pipeline.py     && echo 'app/pipeline.py OK'
          python -m py_compile generation/llm.py    && echo 'generation/llm.py OK'
          python -m py_compile evaluation/eval_main.py && echo 'evaluation/eval_main.py OK'

  eval:
    name: RAG Evaluation (Dev Mode - 95% Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Ollama service
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "--- Ollama log ---"; cat /tmp/ollama.log || true' ERR

          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "Ollama is ready"
              break
            fi
            echo "Waiting for Ollama... ($i)"
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
            echo "Ollama failed to start"
            cat /tmp/ollama.log || true
            exit 1
          fi

          ollama pull qwen3:8b
          ollama pull nomic-embed-text

      - name: Build FAISS indexes
        run: python scripts/build_indexes.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHAT_MODEL: qwen3:8b
          EMBED_MODEL: nomic-embed-text

      - name: Run evaluation (dev mode)
        run: python eval_runner.py --mode dev --report reports/ci_eval.json
        env:
          CHAT_MODEL: qwen3:8b
          EMBED_MODEL: nomic-embed-text

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: reports/ci_eval.json
          retention-days: 30
