name: Evaluation Quality Gate (Strict)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Repo Integrity (Portable)
    runs-on: ubuntu-latest
    # No pip install — stdlib only. Tests repo structure and file validity.

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate eval suite JSON
        run: |
          python -c "
          import json, sys
          data = json.load(open('tests/eval_queries.json', encoding='utf-8'))
          assert isinstance(data, list) and len(data) > 0, 'eval_queries.json is empty or malformed'
          print(f'eval_queries.json OK — {len(data)} tests')
          "

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile eval_runner.py       && echo 'eval_runner.py OK'
          python -m py_compile compare_reports.py   && echo 'compare_reports.py OK'
          python -m py_compile analyze_logs.py      && echo 'analyze_logs.py OK'
          python -m py_compile app/config.py        && echo 'app/config.py OK'
          python -m py_compile app/retriever.py     && echo 'app/retriever.py OK'
          python -m py_compile app/rag_pipeline.py  && echo 'app/rag_pipeline.py OK'
          python -m py_compile app/prompting.py     && echo 'app/prompting.py OK'

  eval_strict:
    name: RAG Evaluation (Strict Mode - 100% Gate)
    runs-on: self-hosted
    # Requires: Ollama running with 'robin-assistant' model, all deps installed locally

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Run strict evaluation
        run: python eval_runner.py --mode strict --report reports/ci_eval_strict.json

      - name: Upload strict evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-strict-report-${{ github.run_id }}
          path: reports/ci_eval_strict.json
          retention-days: 30

      - name: Check strict pass rate
        run: |
          python -c "
          import json, sys
          with open('reports/ci_eval_strict.json', encoding='utf-8') as f:
              report = json.load(f)
          metrics = report['metrics']
          
          # Strict mode: require real_pass_rate >= 0.95
          real_pass_rate = metrics.get('real_pass_rate', 0)
          if real_pass_rate < 0.95:
              print(f'FAIL: Real pass rate {real_pass_rate*100:.1f}% < 95% threshold')
              print(f'Corpus missing: {metrics.get(\"corpus_missing_count\", 0)}')
              print(f'Generic answers: {metrics.get(\"generic_answer_count\", 0)}')
              sys.exit(1)
          
          print(f'PASS: Real pass rate {real_pass_rate*100:.1f}% >= 95% threshold')
          "
