name: Evaluation Quality Gate (Strict)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Repo Integrity (Portable)
    runs-on: ubuntu-latest
    # No pip install — stdlib only. Tests repo structure and file validity.

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Validate eval suite JSON
        run: |
          python -c "
          import json, sys
          data = json.load(open('data/adversarial_eval_queries.json', encoding='utf-8'))
          assert isinstance(data, dict) and 'queries' in data, 'adversarial_eval_queries.json is malformed'
          assert len(data['queries']) > 0, 'adversarial_eval_queries.json is empty'
          print(f'adversarial_eval_queries.json OK — {len(data[\"queries\"])} tests')
          "

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile eval_runner.py       && echo 'eval_runner.py OK'
          python -m py_compile app/config.py        && echo 'app/config.py OK'
          python -m py_compile app/pipeline.py     && echo 'app/pipeline.py OK'
          python -m py_compile generation/llm.py    && echo 'generation/llm.py OK'
          python -m py_compile evaluation/eval_main.py && echo 'evaluation/eval_main.py OK'

  eval_strict:
    name: RAG Evaluation (Strict Mode - 100% Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Ollama service
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 30
          ollama pull robin-assistant

      - name: Build FAISS indexes
        run: python scripts/build_indexes.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run strict evaluation
        run: python eval_runner.py --mode strict --report reports/ci_eval_strict.json

      - name: Upload strict evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-strict-report-${{ github.run_id }}
          path: reports/ci_eval_strict.json
          retention-days: 30

      - name: Check strict pass rate
        run: python scripts/check_strict_pass.py
