# Render deployment configuration
services:
  # Production API service
  - type: web
    name: order-management-backend
    runtime: node
    plan: starter
    buildCommand: chmod +x .render-build.sh && ./.render-build.sh
    startCommand: node .next/standalone/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: KARRIO_BASE_URL
        sync: false
      - key: KARRIO_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
